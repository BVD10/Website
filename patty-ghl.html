<style>
    .patty-landing * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .patty-landing {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #000000;
        color: #ffffff;
        line-height: 1.6;
        overflow-x: hidden;
        min-height: 100vh;
        padding: 20px;
    }

    .patty-container {
        max-width: 800px;
        margin: 0 auto;
    }

    /* Profile Section */
    .patty-profile-section {
        text-align: center;
        padding: 80px 20px 40px;
    }

    .patty-profile-photo {
        width: 200px;
        height: 200px;
        border-radius: 20px;
        margin: 0 auto 40px;
        background: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 4px solid rgba(0, 168, 232, 0.3);
        box-shadow: 0 8px 32px rgba(0, 168, 232, 0.3);
    }

    .patty-profile-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .patty-profile-placeholder {
        font-size: 80px;
        color: #ffffff;
        font-weight: 700;
    }

    .patty-profile-name {
        font-size: 48px;
        font-weight: 500;
        color: #ffffff;
        margin-bottom: 40px;
        letter-spacing: 2px;
    }

    .patty-tagline {
        font-size: 42px;
        font-weight: 600;
        background: linear-gradient(135deg, #00A8E8 0%, #00D4FF 50%, #00A8E8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 70px;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-family: 'Georgia', serif;
        text-shadow: 0 0 30px rgba(0, 168, 232, 0.3);
    }

    /* Social Icons */
    .patty-social-icons {
        display: flex;
        justify-content: center;
        gap: 40px;
        margin-bottom: 60px;
        flex-wrap: wrap;
    }

    .patty-social-icon {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
    }

    .patty-social-icon:hover {
        background: linear-gradient(135deg, #00A8E8, #0088C8);
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 168, 232, 0.4);
    }

    .patty-social-icon svg {
        width: 28px;
        height: 28px;
        fill: #a0a0a0;
        transition: fill 0.3s ease;
    }

    .patty-social-icon:hover svg {
        fill: #ffffff;
    }

    /* CTA Buttons */
    .patty-cta-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-width: 500px;
        margin: 0 auto 80px;
    }

    .patty-cta-button {
        padding: 24px 48px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        position: relative;
        overflow: hidden;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .patty-cta-primary {
        background: linear-gradient(180deg, #00D4FF 0%, #00A8E8 100%);
        color: #000000;
        box-shadow: 0 8px 0 #0088C8, 0 12px 32px rgba(0, 168, 232, 0.5);
        font-weight: 700;
    }

    .patty-cta-primary:hover {
        transform: translateY(4px);
        box-shadow: 0 4px 0 #0088C8, 0 8px 20px rgba(0, 168, 232, 0.5);
        color: #000000;
        text-decoration: none;
    }

    .patty-cta-primary:active {
        transform: translateY(8px);
        box-shadow: 0 0 0 #0088C8, 0 4px 12px rgba(0, 168, 232, 0.5);
    }

    .patty-cta-secondary {
        background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
        color: #00D4FF;
        border: 3px solid #00A8E8;
        font-weight: 700;
        box-shadow: 0 8px 0 #003344, 0 12px 32px rgba(0, 168, 232, 0.3);
    }

    .patty-cta-secondary:hover {
        background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
        color: #00D4FF;
        transform: translateY(4px);
        text-decoration: none;
        box-shadow: 0 4px 0 #003344, 0 8px 20px rgba(0, 168, 232, 0.3);
    }

    .patty-cta-secondary:active {
        transform: translateY(8px);
        box-shadow: 0 0 0 #003344, 0 4px 12px rgba(0, 168, 232, 0.3);
    }

    .patty-arrow-icon {
        font-size: 20px;
        transition: transform 0.3s ease;
    }

    .patty-cta-button:hover .patty-arrow-icon {
        transform: translateX(5px);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .patty-profile-photo {
            width: 160px;
            height: 160px;
        }

        .patty-profile-placeholder {
            font-size: 60px;
        }

        .patty-profile-name {
            font-size: 36px;
        }

        .patty-tagline {
            font-size: 28px;
        }

        .patty-social-icons {
            gap: 25px;
        }

        .patty-social-icon {
            width: 45px;
            height: 45px;
        }

        .patty-cta-button {
            padding: 18px 30px;
            font-size: 16px;
        }
    }

    @media (max-width: 480px) {
        .patty-social-icons {
            gap: 20px;
        }
    }
</style>

<script>
(function() {
    // Smooth scroll for anchor links within the Patty landing page
    document.querySelectorAll('.patty-landing a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth'
                });
            }
        });
    });
})();
</script>
