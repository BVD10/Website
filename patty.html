<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patty - Trading For R*tards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #000000;
            --dark-gray: #1a1a1a;
            --premium-blue: #3b82f6;
            --premium-blue-dark: #2563eb;
            --premium-blue-light: #60a5fa;
            --text-gray: #a0a0a0;
            --text-white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--black);
            color: var(--text-white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Logo */
        .logo {
            text-align: center;
            padding: 40px 0 60px;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--text-white);
            font-family: 'Georgia', serif;
        }

        /* Profile Section */
        .profile-section {
            text-align: center;
            padding: 40px 20px;
        }

        .profile-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 40px;
            background: linear-gradient(135deg, var(--premium-blue), var(--premium-blue-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid var(--dark-gray);
        }

        .profile-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-placeholder {
            font-size: 80px;
            color: var(--text-white);
            font-weight: 700;
        }

        .profile-name {
            font-size: 32px;
            font-weight: 400;
            color: var(--text-gray);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .hero-title {
            font-size: 48px;
            font-weight: 300;
            color: var(--text-white);
            margin-bottom: 20px;
            line-height: 1.2;
            font-family: 'Georgia', serif;
        }

        .hero-subtitle {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-white);
            margin-bottom: 50px;
        }

        .tagline {
            font-size: 20px;
            color: var(--text-gray);
            margin-bottom: 60px;
            font-weight: 300;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 60px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .social-icon:hover {
            background-color: var(--premium-blue);
            transform: translateY(-3px);
        }

        .social-icon svg {
            width: 28px;
            height: 28px;
            fill: var(--text-gray);
            transition: fill 0.3s ease;
        }

        .social-icon:hover svg {
            fill: var(--text-white);
        }

        /* CTA Buttons */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto 80px;
        }

        .cta-button {
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid;
            position: relative;
            overflow: hidden;
        }

        .cta-primary {
            background: linear-gradient(135deg, var(--premium-blue), var(--premium-blue-dark));
            color: var(--text-white);
            border-color: var(--premium-blue);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .cta-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(59, 130, 246, 0.5);
        }

        .cta-secondary {
            background-color: transparent;
            color: var(--premium-blue);
            border-color: var(--premium-blue);
        }

        .cta-secondary:hover {
            background-color: var(--premium-blue);
            color: var(--text-white);
            transform: translateY(-2px);
        }

        .arrow-icon {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover .arrow-icon {
            transform: translateX(5px);
        }

        /* YouTube Section */
        .youtube-section {
            padding: 60px 20px;
            text-align: center;
        }

        .youtube-title {
            font-size: 42px;
            font-weight: 300;
            color: var(--text-white);
            margin-bottom: 40px;
            font-family: 'Georgia', serif;
        }

        .video-placeholder {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--dark-gray), var(--premium-blue-dark));
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 36px;
                letter-spacing: 4px;
            }

            .profile-photo {
                width: 160px;
                height: 160px;
            }

            .profile-placeholder {
                font-size: 60px;
            }

            .profile-name {
                font-size: 24px;
            }

            .hero-title {
                font-size: 36px;
            }

            .hero-subtitle {
                font-size: 22px;
            }

            .tagline {
                font-size: 18px;
            }

            .social-icons {
                gap: 25px;
            }

            .social-icon {
                width: 45px;
                height: 45px;
            }

            .cta-button {
                padding: 18px 30px;
                font-size: 16px;
            }

            .youtube-title {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                padding: 30px 0 40px;
            }

            .hero-title {
                font-size: 28px;
            }

            .hero-subtitle {
                font-size: 20px;
            }

            .social-icons {
                gap: 20px;
            }

            .youtube-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-text">P</div>
        </div>

        <!-- Profile Section -->
        <div class="profile-section">
            <!-- Profile Photo - Replace with actual image -->
            <div class="profile-photo">

                <!-- <img src="path-to-patty-photo.jpg" alt="Patty"> -->

                <!-- Twitter -->
                <a href="#" class="social-icon" aria-label="Twitter">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

                    </svg>
                </a>
            </div>

            <!-- CTA Buttons -->
            <div class="cta-container">
                <a href="#" class="cta-button cta-primary">
                    Join my trading community
                    <span class="arrow-icon">→</span>
                </a>

                <a href="#" class="cta-button cta-secondary">
                    Join the signals chat
                    <span class="arrow-icon">→</span>
                </a>
            </div>
        </div>

        <!-- YouTube Section -->
        <div class="youtube-section">
            <h2 class="youtube-title">Watch me on Youtube</h2>
            <div class="video-placeholder">
                <!-- Replace with actual video embed or thumbnail -->
                <div style="color: var(--text-gray); font-size: 18px;">Video thumbnail coming soon</div>
            </div>
        </div>
    </div>

    <script>
        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Optional: Add fade-in animation on load
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease-in';
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
